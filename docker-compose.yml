services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/models:/app/models # Mount the models in the container
      - ./backend/training:/app/training # Mount the training code in the container
    environment:
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80" # Expose Nginx on port 8080
    depends_on:
      - backend
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
